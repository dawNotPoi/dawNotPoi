name: Generate profile assets

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - ".github/workflows/profile-summary-cards.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick

      - name: Generate rounded avatar
        shell: bash
        run: |
          mkdir -p assets
          curl -fsSL "https://github.com/${{ github.repository_owner }}.png?size=240" -o /tmp/avatar.png
          convert /tmp/avatar.png -resize 180x180^ -gravity center -extent 180x180 \
            \( +clone -threshold -1 -negate -fill white -draw "circle 90,90 90,0" \) \
            -alpha off -compose CopyOpacity -composite assets/avatar.png

      - name: Generate summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 8
          EXCLUDE: ""
          AUTO_PUSH: false

      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/avatar.png profile-summary-card-output/
          if git diff --cached --quiet; then
            echo "No profile asset changes"
            exit 0
          fi
          git commit -m "chore: refresh profile assets"
          git push
