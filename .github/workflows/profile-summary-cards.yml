name: Generate profile assets

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - ".github/workflows/profile-summary-cards.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick

      - name: Generate rounded avatar
        shell: bash
        run: |
          mkdir -p assets
          curl -fsSL "https://github.com/${{ github.repository_owner }}.png?size=240" -o /tmp/avatar.png
          convert /tmp/avatar.png -resize 180x180^ -gravity center -extent 180x180 \
            \( +clone -threshold -1 -negate -fill white -draw "circle 90,90 90,0" \) \
            -alpha off -compose CopyOpacity -composite assets/avatar.png

      - name: Generate language card
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 8
          EXCLUDE: ""
          THEME: github_dark
          AUTO_PUSH: false

      - name: Restyle generated cards
        shell: bash
        run: |
          # 统一视觉语言: 标题链接蓝 -> 正文白, 标签灰对齐 Codex 卡, 标题字号收敛
          # 这些卡片由上面的 action 生成, 每天会被重新覆盖, 因此必须在此处重做改色
          find profile-summary-card-output -name '*.svg' -print0 | while IFS= read -r -d '' f; do
            sed -i \
              -e 's/fill: #0366d6/fill: #e6edf3/g' \
              -e 's/#77909c/#8b949e/g' \
              -e 's/font-size: 22px/font-size: 18px/g' \
              "$f"
          done

      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/avatar.png profile-summary-card-output/
          if git diff --cached --quiet; then
            echo "No profile asset changes"
            exit 0
          fi
          git commit -m "chore: refresh profile assets"
          git push
