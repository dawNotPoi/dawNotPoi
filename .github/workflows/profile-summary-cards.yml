name: Generate profile assets

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - ".github/workflows/profile-summary-cards.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick

      - name: Generate rounded avatar
        shell: bash
        run: |
          mkdir -p assets
          curl -fsSL "https://github.com/${{ github.repository_owner }}.png?size=240" -o /tmp/avatar.png
          convert /tmp/avatar.png -resize 180x180^ -gravity center -extent 180x180 \
            \( +clone -threshold -1 -negate -fill white -draw "circle 90,90 90,0" \) \
            -alpha off -compose CopyOpacity -composite assets/avatar.png

      - name: Generate language card
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 8
          EXCLUDE: ""
          THEME: github_dark
          AUTO_PUSH: false

      - name: Restyle generated cards
        shell: bash
        run: |
          # 保留 github_dark 输出目录以避免 README 路径变更，但将所有统计卡统一为
          # Codex Token Activity 的蓝白视觉：白底、GitHub 浅灰边框、深色标题/正文和蓝色图表。
          # Action 每天都会重新生成 SVG，因此改色必须放在生成步骤之后。
          find profile-summary-card-output/github_dark -name '*.svg' -print0 | while IFS= read -r -d '' f; do
            sed -i \
              -e 's/#0d1117/#ffffff/gI' \
              -e 's/#2e343b/#d0d7de/gI' \
              -e 's/#e6edf3/#24292f/gI' \
              -e 's/#0366d6/#24292f/gI' \
              -e 's/#8b949e/#6e7781/gI' \
              -e 's/#77909c/#6e7781/gI' \
              -e 's/#40c463/#2563eb/gI' \
              -e 's/#3178c6/#2563eb/gI' \
              -e 's/#3572a5/#60a5fa/gI' \
              -e 's/#f1e05a/#93c5fd/gI' \
              -e 's/#dea584/#bfdbfe/gI' \
              -e 's/#00add8/#dbeafe/gI' \
              -e 's/font-size: 22px/font-size: 18px/g' \
              "$f"
          done

      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/avatar.png profile-summary-card-output/
          if git diff --cached --quiet; then
            echo "No profile asset changes"
            exit 0
          fi
          git commit -m "chore: refresh profile assets"
          git push
